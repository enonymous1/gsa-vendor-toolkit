[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendors-toolkit"
version = "0.1.0"
description = "GSA vendor price-list pipeline: download, organize, merge, filter, analyze, and report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "scipy>=1.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs",
]

[project.scripts]
vendors-toolkit = "vendors_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

# dashboard.py's HTML template reproduces the original report shell
# byte-for-byte, including its trailing spaces / whitespace-only lines.
[tool.ruff.lint.per-file-ignores]
"src/vendors_toolkit/reporting/dashboard.py" = ["W293", "W291"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
